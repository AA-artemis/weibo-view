<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ff8200">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="观点库">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>微博观点库 · 极简整理工具</title>
<style>
  :root{
    --accent:#ff8200; --bg:#f6f6f7; --card:#fff; --line:#e6e6e9;
    --txt:#222; --sub:#888; --danger:#d94838; --radius:12px;
    --sideW:232px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt);}
  button{cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 13px; font-size:14px; color:var(--txt); transition:.15s;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{opacity:.9; color:#fff;}
  button.danger:hover{border-color:var(--danger); color:var(--danger);}
  button.icon{padding:3px 9px; font-size:13px;}
  input,select,textarea{font:inherit; border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:#fff; color:var(--txt);}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}

  /* ===== 顶栏 ===== */
  header{background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; position:sticky; top:0; z-index:30;}
  .hrow{display:flex; gap:9px; align-items:center; max-width:1180px; margin:0 auto;}
  .menuBtn{display:none; font-size:17px; padding:5px 11px; flex:none;}
  .logo{font-weight:700; font-size:17px; white-space:nowrap;}
  .logo em{font-style:normal; color:var(--accent);}
  #linkInput{flex:1; min-width:120px;}
  #prog{color:var(--sub); font-size:12px; flex:1; text-align:right; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #stopBtn{display:none;}
  #pasteToggle{flex:none;}

  /* ===== 工具条：手机横向滑动 ===== */
  .toolbar{max-width:1180px; margin:12px auto 0; padding:0 16px; display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .toolbar label{font-size:13px; color:var(--sub); display:flex; gap:5px; align-items:center; cursor:pointer; white-space:nowrap;}
  .toolbar .scope{color:var(--sub); font-size:12px; margin-left:auto; white-space:nowrap;}
  #pasteBox{display:none; max-width:1180px; margin:10px auto 0; padding:0 16px;}
  #pasteBox.open{display:block;}
  #pasteArea{width:100%; height:130px; resize:vertical; font-size:14px;}
  .hint{color:var(--sub); font-size:12px; margin-top:4px;}

  /* ===== 布局 ===== */
  .wrap{max-width:1180px; margin:14px auto 60px; padding:0 16px; display:flex; gap:16px; align-items:flex-start;}
  aside{width:var(--sideW); flex:none; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px; position:sticky; top:66px; max-height:calc(100vh - 84px); overflow-y:auto;}
  .asideHead{display:flex; align-items:center; justify-content:space-between; padding:2px 4px 8px; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .asideHead span{font-size:13px; color:var(--sub);}
  .asideHead .x{border:none; background:none; font-size:17px; color:#bbb; padding:0 4px; display:none;}
  .cat{display:flex; align-items:center; gap:6px; padding:8px 9px; border-radius:8px; cursor:pointer; user-select:none; margin-bottom:2px; border:1px solid transparent;}
  .cat:hover{background:#faf7f2;}
  .cat.sel{background:#fff3e6; border-color:#ffd9ad;}
  .cat .grip{color:#c9c9cf; cursor:grab; font-size:13px;}
  .cat .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px;}
  .cat .ct{font-size:11px; color:var(--sub); background:#f1f1f3; border-radius:9px; padding:0 7px; flex:none;}
  .cat .del{visibility:hidden; border:none; background:none; color:#bbb; padding:0 2px; font-size:15px;}
  .cat:hover .del{visibility:visible;}
  .cat .del:hover{color:var(--danger);}
  .cat.dragging{opacity:.4;}
  .cat.over{border-top:2px solid var(--accent);}
  .cat.allrow{font-weight:600;}
  .addRow{display:flex; gap:6px; margin-top:8px;}
  .addRow input{flex:1; min-width:0;}
  .sideTab{display:none; position:fixed; left:0; top:45%; z-index:25; border-radius:0 9px 9px 0; border-left:none; padding:10px 7px; writing-mode:vertical-rl; letter-spacing:2px; box-shadow:2px 0 8px rgba(0,0,0,.06);}

  main{flex:1; min-width:0;}
  .group{margin-bottom:26px;}
  .group>h2{font-size:16px; margin-bottom:10px; padding-left:2px;}
  .group>h2 span{color:var(--sub); font-size:12.5px; font-weight:400;}
  /* ===== 只读卡片 ===== */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card .t{font-weight:600; font-size:15.5px; line-height:1.5;}
  .card .badge{display:inline-block; font-size:11px; color:var(--accent); background:#fff3e6; border-radius:9px; padding:1px 9px; margin-bottom:6px;}
  .card .tx{white-space:pre-wrap; font-size:15px; line-height:1.75; margin-top:6px; word-break:break-word;}
  .imgs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .imgs .im{position:relative; width:82px; height:82px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#f2f2f4;}
  .imgs img{width:100%; height:100%; object-fit:cover; display:block;}
  .imgs .add{width:82px; height:82px; border:1px dashed var(--line); border-radius:8px; background:none; color:var(--sub); font-size:20px;}
  .imgs .add:hover{border-color:var(--accent); color:var(--accent);}
  .foot{margin-top:10px; font-size:12.5px; color:var(--sub); display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .foot .meta{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .empty{color:var(--sub); text-align:center; padding:60px 0; background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);}

  /* ===== 编辑弹层 ===== */
  .mask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60;}
  .mask.open{display:block;}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-height:92vh; overflow-y:auto; background:#fff; border-radius:16px 16px 0 0; padding:16px; z-index:61; transform:translateY(100%); transition:transform .22s;}
  .mask.open .sheet{transform:none;}
  .shTitle{display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:16px; margin-bottom:12px;}
  .shTitle .x{border:none; background:none; font-size:20px; color:#999; padding:0 4px;}
  .fld{display:block; margin-bottom:12px;}
  .fld .flbl{font-size:12.5px; color:var(--sub); margin-bottom:4px;}
  .fld input,.fld select{width:100%;}
  .fld textarea{width:100%; min-height:220px; resize:vertical; font-size:15px; line-height:1.75;}
  .edBtns{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; position:sticky; bottom:-16px; background:#fff; padding:10px 0 2px; border-top:1px solid var(--line);}
  .edBtns .sp{flex:1;}

  /* ===== 打印 ===== */
  #printArea{display:none;}
  @media print{
    body{background:#fff;}
    header,.toolbar,.wrap,#pasteBox,.backdrop,.mask{display:none !important;}
    #printArea{display:block; padding:0;}
    #printArea h1{font-size:20px; margin-bottom:4px;}
    #printArea .meta{color:#666; font-size:11px; margin-bottom:18px;}
    #printArea h2{font-size:15px; margin:16px 0 8px; border-bottom:1px solid #ddd; padding-bottom:3px;}
    #printArea .it{margin-bottom:14px; page-break-inside:avoid;}
    #printArea .tt{font-weight:700; font-size:13px;}
    #printArea .tx{white-space:pre-wrap; font-size:12px; margin-top:2px;}
    #printArea .src{color:#777; font-size:10.5px; margin-top:2px; word-break:break-all;}
  }

  .backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39;}

  /* ===== 手机适配 ===== */
  @media (max-width:860px){
    .menuBtn{display:inline-flex;}
    .hrow{flex-wrap:nowrap;}
    #linkInput{display:none;}
    #pasteToggle{margin-left:auto;}
    .toolbar{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px; scrollbar-width:none;}
    .toolbar::-webkit-scrollbar{display:none;}
    .toolbar .scope{margin-left:0;}
    /* 侧栏 → 抽屉 */
    .backdrop.show{display:block;}
    aside{position:fixed; left:0; top:0; bottom:0; width:min(80vw,300px); max-height:none; z-index:40; border-radius:0 14px 14px 0; transform:translateX(-106%); transition:transform .22s; overflow-y:auto;}
    body.drawer-open aside{transform:none;}
    .asideHead .x{display:block;}
    .sideTab{display:none !important;}
    .wrap{margin-top:10px; padding:0 12px;}
    .card{padding:14px 14px;}
    .card .tx{font-size:15.5px;}
    .imgs .im{width:calc((100vw - 24px - 28px - 16px)/3); height:calc((100vw - 24px - 28px - 16px)/3); max-width:120px; max-height:120px;}
  }
  @media (min-width:861px){
    body.side-off aside{display:none;}
    body.side-off .sideTab{display:block;}
  }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <button class="menuBtn" id="menuBtn" title="分类">☰</button>
    <div class="logo">微博<em>观点库</em></div>
    <input id="linkInput" placeholder="粘贴微博主页链接（如 https://weibo.com/u/1234567890 或纯数字UID）">
    <button class="primary" id="fetchBtn">抓取</button>
    <button id="stopBtn">停止</button>
    <span id="prog"></span>
    <button id="pasteToggle">粘贴导入</button>
  </div>
  <div id="pasteBox">
    <textarea id="pasteArea" placeholder="方案B：把微博主页内容直接粘贴到这里&#10;① 网页版主页全选复制页面文字，或&#10;② 打开 m.weibo.cn 接口地址（抓取失败时界面会给出），全选复制 JSON"></textarea>
    <button class="primary" id="parseBtn" style="margin-top:6px;">解析粘贴内容</button>
    <div class="hint">解析规则：自动剔除时间行、赞/转/评计数行、@他人的评论行；只保留博主本人文字。转发的微博只保留博主自己写的部分。</div>
  </div>
</header>

<div class="toolbar">
  <label><input type="checkbox" id="incSrc"> 导出附带来源</label>
  <span class="scope" id="scopeTip"></span>
  <button id="impJson">📂 导入JSON</button>
  <button id="expJson">💾 导出JSON</button>
  <button id="expDocx">导出 Word</button>
  <button id="expPdf">导出 PDF</button>
  <button id="expTxt">导出文本</button>
  <button id="copyTxt">复制文本</button>
  <input id="jsonFile" type="file" accept="application/json,.json" style="display:none">
</div>

<div class="wrap">
  <aside id="sidebar">
    <div class="asideHead"><span>分类（长按名称可重命名）</span><button class="x" id="asideClose">×</button></div>
    <div id="catList"></div>
    <div class="addRow">
      <input id="newCat" placeholder="新分类名">
      <button id="addCat">添加</button>
    </div>
  </aside>
  <main id="entryArea"></main>
</div>
<button class="sideTab" id="sideTab">☰ 分类</button>

<div class="backdrop" id="backdrop"></div>

<div class="mask" id="mask">
  <div class="sheet">
    <div class="shTitle"><span>编辑条目</span><button class="x" id="edClose">×</button></div>
    <label class="fld"><div class="flbl">小标题</div><input id="edTitle" placeholder="小标题"></label>
    <label class="fld"><div class="flbl">所属分类</div><select id="edCat"></select></label>
    <label class="fld"><div class="flbl">正文（保持原文）</div><textarea id="edText" placeholder="原文…"></textarea></label>
    <div class="fld"><div class="flbl">配图</div><div class="imgs" id="edImgs"></div></div>
    <div class="edBtns">
      <button id="edUp" title="在同分类内上移">↑</button>
      <button id="edDown" title="在同分类内下移">↓</button>
      <span class="sp"></span>
      <button class="danger" id="edDel">删除</button>
      <button id="edCancel">取消</button>
      <button class="primary" id="edSave">保存</button>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script>
'use strict';
/* ================= 数据模型 ================= */
const KEY='weibo_opinion_v1';
let cats=[], entries=[], incSrc=false, curCat='all';
let fetching=false, abortCtl=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function defaultState(){
  return {
    cats:[
      // 直播相关（优先级高于好物，例如"穿搭"在直播语境下归为造型）
      {id:'l_bg',       name:'直播相关 · 背景/布置'},
      {id:'l_style',    name:'直播相关 · 造型/妆容'},
      {id:'l_chat',     name:'直播相关 · 聊天内容/话题'},
      {id:'l_private',  name:'直播相关 · 私聊/维护'},
      {id:'l_skill',    name:'直播相关 · 赚钱/心法/套路'},
      // 好物分享
      {id:'h_clothing', name:'好物分享 · 服装穿搭'},
      {id:'h_shoes_bags',name:'好物分享 · 鞋包配饰'},
      {id:'h_beauty',   name:'好物分享 · 美妆护肤'},
      {id:'h_daily',    name:'好物分享 · 日用好物'},
      {id:'h_food',     name:'好物分享 · 零食餐饮'},
      // 思维方式
      {id:'m_money',    name:'思维方式 · 金钱观/消费观'},
      {id:'m_gender',   name:'思维方式 · 男女/情感关系'},
      {id:'m_life',     name:'思维方式 · 生活/人生态度'},
      {id:'m_work',     name:'思维方式 · 工作/搞钱思维'},
      // 其他
      {id:'o_daily',    name:'其他 · 日常碎碎念'}
    ],
    entries:[], inc:false
  };
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY));
    if(!s||!Array.isArray(s.cats)) return false;
    cats=s.cats; entries=s.entries||[]; incSrc=!!s.inc;
    document.getElementById('incSrc').checked=incSrc;
    return true;
  }catch(e){return false;}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({cats,entries,inc:incSrc}));}
  catch(e){setProg('⚠ 保存失败：浏览器存储空间不足');}
}

/* ================= 工具函数 ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function setProg(t){document.getElementById('prog').textContent=t||'';}
function htmlToText(html){
  let s=String(html||'');
  s=s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<img[^>]*>/gi,'');
  s=s.replace(/<[^>]+>/g,'');
  const d=document.createElement('textarea'); d.innerHTML=s; s=d.value;
  return s.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

function genTitle(text){
  let t=(text||'').replace(/https?:\/\/\S+/g,'').trim();
  const m=t.match(/#([^#\n]{1,24})#/);
  if(m&&m[1].trim()) return m[1].trim();
  let line=(t.split('\n').find(l=>l.trim())||'').trim().replace(/^(转发微博[:：]?|Re:?)/i,'').trim();
  if(!line) return '未命名';
  let head=line.slice(0,26);
  const cut=head.search(/[，,、；;：:。!！?？]/);
  if(cut>=6) head=head.slice(0,cut);
  else head=head.slice(0,24);
  return head.trim()||'未命名';
}
/* ================= 分类规则（与 Python classifier_rules.json 一致） ================= */
const PRIORITY_ORDER=['l_bg','l_style','l_chat','l_private','l_skill','h_clothing','h_shoes_bags','h_beauty','h_daily','h_food','m_money','m_gender','m_life','m_work','o_daily'];
// 主分类归属：用于判断当同分时谁优先（直播 > 好物 > 思维 > 其他）
const MAIN_PRIORITY = { l:0, h:1, m:2, o:3 };
// 否定词：<否定词 + 关键词> 相邻时，不计入命中
const NEGATIONS=['没化妆','没买','没穿','没做','不想','不喜欢','不是','不要','别买','别穿','不爱','不确定','不确保','不适用','不说话','不算','不记得','没收到','不想洗头','不怕水','不花钱','白嫖不好骗','不买','别是'];

function mainOf(subId){ return subId.split('_')[0]; }  // 'l_style' -> 'l'

const SUB_KW={
  // ===== 直播相关 =====
  l_bg:['灯光','背景','布置','镜头','怼脸','高清','角度','打光','补光','房间','桌面','摄像头','焦距','灯','灯源','支架','显示器','行李箱','丝袜罩子','痣','盖章','内衣带','菜','场关'],
  l_style:['穿搭','发型','妆容','化妆','造型','好看','穿什么','衣服','显大','头包脸','颅顶','高颅顶','发型教程','发箍效果','颜值','擦大边','男性审美','性感','镂空','纯欲','清纯','土纯','萌','美女感','合身','白雪公主','头小','显胖','显瘦','娇嫩','少女','上镜'],
  l_chat:['话题','聊天','互动','观众','说','念','分享','唠','透明化','思维透明','外卖','游戏','刷','朋友圈','pyq','xhs','小红书','摸鱼','短视频','留白','多说点','共情','即兴演讲','低头玩手机','思维透明化','透明出来','话题透明化'],
  l_private:['私聊','私发','私下','vx','微信','zfb','支付宝','维护','网易云','pyq','朋友圈','售后','现实','见面','加好友','互关','清关注','拉黑','备注','送礼物维护','私聊篇','聊天技巧','雌竞','进货','筛选','冷处理','不回复','打官司','自愿赠予','起诉','报警','传播','举报','封号','拉黑','转账','代付','联系','大哥大姐','v提示风险','叽付宝','vx风险','联系方式','骚扰','群发'],

function countKW(text, kwList){
  // 返回：{count, hits: [], negatedHits: []}
  const t = String(text||'').toLowerCase();
  const hits=[], negated=[];
  // 找出否定词窗口
  const negSpans=[];
  for(const neg of NEGATIONS){
    const nl = neg.toLowerCase();
    let idx=0;
    while(true){
      const p = t.indexOf(nl, idx);
      if(p<0) break;
      negSpans.push([Math.max(0,p-2), p+nl.length+8]);  // 否定词前后窗口
      idx = p+nl.length;
    }
  }
  for(const kw of (kwList||[])){
    if(!kw) continue;
    const kl = kw.toLowerCase();
    let idx=0;
    while(true){
      const p = t.indexOf(kl, idx);
      if(p<0) break;
      let bad=false;
      for(const [s,e] of negSpans){ if(s<=p && p<=e){bad=true;break;} }
      if(bad){ negated.push(kw); }
      else   { hits.push(kw); }
      idx = p+kl.length;
    }
  }
  // 去重保序
  const u = a => Array.from(new Set(a));
  return { count:u(hits).length, hits:u(hits), negated:u(negated) };
}

/**
 * 猜测分类（前端内用）：
 * 给每个子分类打分 = 子类命中数 + 同一主分类的关键词命中*0.5
 * 再用 mainGroupOf 做优先级决断
 */
function guessCat(text){
  const results = [];
  const allSubIds = PRIORITY_ORDER;
  for(const sid of allSubIds){
    const kw = SUB_KW[sid] || [];
    const sub = countKW(text, kw);
    results.push({ sid, score: sub.count, hits: sub.hits });
  }
  // 排序：分数降序，同分按 PRIORITY_ORDER 顺序
  results.sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    return PRIORITY_ORDER.indexOf(a.sid)-PRIORITY_ORDER.indexOf(b.sid);
  });
  const winner = results[0];
  if(!winner || winner.score===0) return 'o_daily';
  return winner.sid;
}

/** 重分类所有未人工改过的条目（可选，在导入后调用） */
function reclassifyAll(onlyIfNoUserEdit=false){
  for(const e of entries){
    if(onlyIfNoUserEdit && e._userEdited) continue;
    e.cat = guessCat(e.text || '');
  }
  save(); render();
}

async function fetchJSON(url){
  let lastErr=null;
  for(const p of PROXIES){
    try{
      const timer=new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),30000));
      const r=await Promise.race([fetch(p(url),{signal:abortCtl.signal}),timer]);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt=await r.text();
      return JSON.parse(txt);
    }catch(e){
      if(e.name==='AbortError') throw e;
      lastErr=e;
    }
  }
  throw lastErr||new Error('all proxies failed');
}
function parseUid(str){
  const s=(str||'').trim();
  let m=s.match(/weibo\.(?:com|cn)\/u\/(\d+)/)||s.match(/[?&]uid=(\d+)/)||s.match(/containerid=107603(\d+)/);
  if(m) return m[1];
  if(/^\d{5,}$/.test(s)) return s;
  return null;
}
function mblogToEntry(mb,ownerUid){
  const html=mb.text||'';
  let text=htmlToText(html);
  const pics=((mb.pics)||[]).map(p=>(p.large&&p.large.url)||p.url).filter(Boolean);
  const isRt=!!mb.retweeted_status; // 转发：仅保留博主自己写的文字与配图，忽略被转发原文
  if(isRt) text=text.replace(/^转发微博[:：]?$/,'').trim();
  if(!text&&!pics.length) return null;
  if(!text) text='（本条无文字，配图如下）';
  const video=(mb.page_info&&mb.page_info.type==='video')?(mb.page_info.page_url||''):'';
  return {
    id:uid(), sid:String(mb.id||''),
    title:genTitle(text), text,
    images:pics,
    cat:guessCat(text),
    src:'https://weibo.com/'+ownerUid+'/'+(mb.bid||mb.id||''),
    time:mb.created_at||'', video
  };
}
async function importCards(cards,ownerUid){
  const out=[];
  for(const c of (cards||[])){
    const mb=c.mblog||((c.data&&c.data.mblog));
    if(!mb||mb.isAd) continue;
    const e=mblogToEntry(mb,ownerUid);
    if(e) out.push(e);
  }
  // 展开长文（尽力而为）
  let done=0;
  for(let i=0;i<out.length;i++){
    const raw=(cards||[]).map(c=>c.mblog).filter(Boolean).find(m=>String(m.id)===out[i].sid);
    if(!raw||!(raw.text||'').includes('>全文<')) continue;
    done++;
    setProg('展开长文 '+done+' …');
    try{
      const d=await fetchJSON('https://m.weibo.cn/statuses/extend?id='+out[i].sid);
      const lt=d&&d.data&&((d.data.longText&&d.data.longText.longTextContent)||d.data.longTextContent);
      if(lt) out[i].text=lt.trim();
    }catch(e){}
  }
  for(const e of out){ e.title=genTitle(e.text); e.cat=guessCat(e.text); }
  return out;
}
function mergeImport(list){
  let added=0,skipped=0;
  const sidSet=new Set(entries.map(e=>e.sid).filter(Boolean));
  for(const e of list){
    if(e.sid&&sidSet.has(e.sid)){skipped++;continue;}
    if(e.sid) sidSet.add(e.sid);
    entries.push(e); added++;
  }
  save(); render();
  return {added,skipped};
}
async function doFetch(){
  if(fetching) return;
  const uidv=parseUid(document.getElementById('linkInput').value);
  if(!uidv){alert('无法识别 UID。支持：weibo.com/u/数字ID、m.weibo.cn/u/数字ID、含 uid= 参数的链接、或直接输入纯数字ID。');return;}
  fetching=true; abortCtl=new AbortController();
  document.getElementById('fetchBtn').disabled=true;
  document.getElementById('stopBtn').style.display='';
  let since='',page=0,added=0,skipped=0,failed='';
  try{
    while(fetching&&page<6){
      page++;
      setProg('第 '+page+' 页抓取中…');
      const api='https://m.weibo.cn/api/container/getIndex?type=uid&value='+uidv+'&containerid=107603'+uidv+(since?('&since_id='+since):'');
      let j;
      try{ j=await fetchJSON(api); }
      catch(e){
        if(e.name==='AbortError') throw e;
        failed='网络代理均不可用'; break;
      }
      if(!j||!j.ok||!j.data){ failed=(!j||j.ok===0)?'接口返回异常（可能需要登录态或UID有误）':'接口返回为空'; break; }
      const list=await importCards(j.data.cards||[],uidv);
      const r=mergeImport(list); added+=r.added; skipped+=r.skipped;
      setProg('已获取 '+added+' 条（第 '+page+' 页）');
      since=j.data.since_id||'';
      if(!since) break;
    }
  }catch(e){}
  fetching=false; abortCtl=null;
  document.getElementById('fetchBtn').disabled=false;
  document.getElementById('stopBtn').style.display='none';
  if(failed&&added===0){
    setProg('');
    alert('自动抓取失败（'+failed+'）。\n\n备用方案：\n1. 手机/电脑打开该用户微博主页；\n2. 全选复制页面文字（或复制 m.weibo.cn 接口返回的 JSON）；\n3. 点击右上角【粘贴导入】完成提取。');
  }else{
    setProg('完成：新增 '+added+' 条'+(skipped?('，跳过重复 '+skipped+' 条'):''));
    setTimeout(()=>setProg(''),6000);
  }
}

/* ================= 导入：粘贴解析 ================= */
const DROP_LINE=[
  /^(转发|赞|评论|收藏)\s*\[?\d*\]?\s*$/,
  /^(转发|赞|评论|收藏)(\s*\d+|\[\d+\])+.*$/,
  /^来自\s*\S+\s*$/,
  /^(今天|昨天|\d{1,2}月\d{1,2}日|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}-\d{1,2})\s*\d{1,2}:\d{2}/,
  /^\d+\s*(分钟|小时|秒)前$/,
  /^编辑于/,
  /^(收起|展开|全文)$|^查[看元]/,
  /^\/\*[\s\S]*\*\/$/
];
const COMMENT_LINE=[/^回复\s*@/,/^@[\w\u4e00-\u9fa5_-]{1,30}\s*[:：]/];
function isDropLine(l){
  const s=l.trim();
  if(!s) return false;
  if(COMMENT_LINE.some(r=>r.test(s))) return true;
  if(DROP_LINE.some(r=>r.test(s))&&s.length<60) return true;
  return false;
}
function isTimeBoundary(l){
  const s=l.trim();
  return s.length<40&&(/^(今天|昨天|\d{1,2}月\d{1,2}日|\d{4}-\d{1,2}-\d{1,2})\s*\d{1,2}:\d{2}/.test(s)||/来自\s*\S+$/.test(s)||/^\d+\s*(分钟|小时|秒)前$/.test(s));
}
function parsePastedText(raw){
  let text=raw.replace(/\r\n?/g,'\n').trim();
  // ① 直接是接口 JSON
  if(text.startsWith('{')){
    try{
      const j=JSON.parse(text);
      if(j&&j.data&&j.data.cards){
        const u=(j.data.userInfo&&j.data.userInfo.id)||'';
        return importCards(j.data.cards,u);
      }
    }catch(e){}
  }
  // ② 纯文本启发式解析
  const lines=text.split('\n');
  const blocks=[]; let cur=[];
  for(const l of lines){
    if(isTimeBoundary(l)){ if(cur.some(x=>!isDropLine(x))) blocks.push(cur); cur=[]; continue; }
    cur.push(l);
  }
  if(cur.some(x=>!isDropLine(x))) blocks.push(cur);
  const out=[];
  for(const b of blocks){
    const kept=b.filter(l=>!isDropLine(l));
    let t=kept.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^转发微博[:：]?\n?/,'').trim();
    if(!t) continue;
    t=t.replace(/^\/\/@[\s\S]{0,40}?:/,'').trim();
    out.push({id:uid(),sid:null,title:genTitle(t),text:t,images:[],cat:guessCat(t),src:'',time:'',video:''});
  }
  return out;
}

function selectCat(i){
  curCat = (i<0) ? 'all' : cats[i].id;
  render();
  // 手机端：选中后收起抽屉
  if(window.innerWidth<=860) document.body.classList.remove('drawer-open');
}
document.getElementById('catList').addEventListener('click',ev=>{
  const row=ev.target.closest('.cat'); if(!row) return;
  const i=+row.dataset.i;
  const act=ev.target.dataset.act;
  if(i>=0&&act==='del'){
    const c=cats[i];
    if(cats.length<=1){alert('至少保留一个分类');return;}
    if(!confirm('删除分类「'+c.name+'」？其中条目将移入「其他」（若无则移入第一个分类）。')) return;
    const fb=(cats.find(x=>x.name==='其他'&&x.id!==c.id)||cats.find(x=>x.id!==c.id)).id;
    entries.forEach(e=>{if(e.cat===c.id)e.cat=fb;});
    if(curCat===c.id) curCat='all';
    cats.splice(i,1); save(); render(); return;
  }
  selectCat(i);
});
document.getElementById('catList').addEventListener('dblclick',ev=>{
  const row=ev.target.closest('.cat'); if(!row||+row.dataset.i<0) return;
  const c=cats[+row.dataset.i];
  const nm=prompt('重命名分类：',c.name);
  if(nm&&nm.trim()){c.name=nm.trim(); save(); render();}
});

const catList=document.getElementById('catList');
catList.addEventListener('dragstart',ev=>{
  const row=ev.target.closest('.cat'); if(!row||+row.dataset.i<0) return;
  dragIdx=+row.dataset.i; row.classList.add('dragging');
  ev.dataTransfer.effectAllowed='move';
});
catList.addEventListener('dragend',()=>{
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('dragging','over'));
  dragIdx=-1;
});
catList.addEventListener('dragover',ev=>{
  ev.preventDefault();
  const row=ev.target.closest('.cat');
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('over'));
  if(row&&+row.dataset.i>=0) row.classList.add('over');
});
catList.addEventListener('drop',ev=>{
  ev.preventDefault();
  const row=ev.target.closest('.cat'); if(!row||dragIdx<0||+row.dataset.i<0) return;
  const to=+row.dataset.i;
  if(to===dragIdx) return;
  const [m]=cats.splice(dragIdx,1); cats.splice(to,0,m);
  save(); render();
});

/* ================= 条目展示（只读）与排序 ================= */
function visibleEntries(){
  return curCat==='all'?entries:entries.filter(e=>e.cat===curCat);
}
function moveEntry(id,dir){
  const i=entries.findIndex(e=>e.id===id); if(i<0) return;
  const catId=entries[i].cat;
  let j=i+dir;
  while(j>=0&&j<entries.length&&entries[j].cat!==catId) j+=dir;
  if(j<0||j>=entries.length) return;
  [entries[i],entries[j]]=[entries[j],entries[i]];
  save(); render();
}
function renderEntries(){
  const area=document.getElementById('entryArea');
  const list=visibleEntries();
  document.getElementById('scopeTip').textContent='当前：'+(curCat==='all'?'全部':(cats.find(c=>c.id===curCat)||{}).name)+' · '+list.length+' 条';
  if(!list.length){
    area.innerHTML='<div class="empty"><b>暂无条目</b><br>点击左上角 ☰ 选择分类，或用顶部按钮导入数据。</div>';
    return;
  }
  const groups=curCat==='all'
    ? cats.map(c=>({c,items:entries.filter(e=>e.cat===c.id)})).filter(g=>g.items.length)
    : [{c:cats.find(c=>c.id===curCat)||{name:'?'},items:list}];
  area.innerHTML=groups.map(g=>
    '<div class="group"><h2>'+esc(g.c.name)+' <span>('+g.items.length+')</span></h2>'
    +g.items.map(e=>entryCard(e)).join('')+'</div>'
  ).join('');
}
function entryCard(e){
  const catName=(cats.find(c=>c.id===e.cat)||{}).name||'未分类';
  const imgs=(e.images||[]).map(u=>
    '<span class="im"><a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" loading="lazy" alt=""></a></span>').join('');
  return '<div class="card" data-id="'+e.id+'">'
    +'<div class="badge">'+esc(catName)+'</div>'
    +'<div class="t">'+esc(e.title)+'</div>'
    +'<div class="tx">'+esc(e.text)+'</div>'
    +(imgs?('<div class="imgs">'+imgs+'</div>'):'')
    +'<div class="foot">'
      +'<span class="meta">'
        +(e.time?('· '+esc(e.time)):'')
        +(e.video?('· <a href="'+esc(e.video)+'" target="_blank">视频</a>'):'')
        +(e.src?('· <a href="'+esc(e.src)+'" target="_blank">原文</a>'):'')
      +'</span>'
      +'<button class="icon" data-act="up" title="上移">↑</button>'
      +'<button class="icon" data-act="down" title="下移">↓</button>'
      +'<button class="icon" data-act="edit" title="编辑">✎ 编辑</button>'
    +'</div>'
  +'</div>';
}
document.getElementById('entryArea').addEventListener('click',ev=>{
  const btn=ev.target.closest('button[data-act]'); if(!btn) return;
  const card=btn.closest('.card');
  const e=entries.find(x=>x.id===card.dataset.id); if(!e) return;
  switch(btn.dataset.act){
    case 'up': moveEntry(e.id,-1); break;
    case 'down': moveEntry(e.id,1); break;
    case 'edit': openEditor(e.id); break;
  }
});

document.getElementById('edImgs').addEventListener('click',ev=>{

/* --- Word (.docx)：内置 store-only ZIP --- */
const CRC_T=(()=>{const t=new Int32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xff]^(c>>>8);return (c^-1)>>>0;}
function zipStore(files){
  const enc=new TextEncoder();
  const chunks=[]; const central=[]; let offset=0;
  const w16=(dv,o,v)=>{dv.setUint16(o,v,true);};
  const w32=(dv,o,v)=>{dv.setUint32(o,v>>>0,true);};
  for(const f of files){
    const data=(typeof f.data==='string')?enc.encode(f.data):f.data;
    const name=enc.encode(f.name);
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    w32(lh,0,0x04034b50); w16(lh,4,20); w16(lh,6,0x0800); w16(lh,8,0);
    w16(lh,10,0); w16(lh,12,0); w32(lh,14,crc);
    w32(lh,18,data.length); w32(lh,22,data.length);
    w16(lh,26,name.length); w16(lh,28,0);
    chunks.push(new Uint8Array(lh.buffer),name,data);
    central.push({name,crc,size:data.length,offset});
    offset+=30+name.length+data.length;
  }
  const cdStart=offset; let cdSize=0;
  for(const c of central){
    const ch=new DataView(new ArrayBuffer(46));
    w32(ch,0,0x02014b50); w16(ch,4,20); w16(ch,6,20); w16(ch,8,0x0800); w16(ch,10,0);
    w16(ch,12,0); w16(ch,14,0); w32(ch,16,c.crc);
    w32(ch,20,c.size); w32(ch,24,c.size); w16(ch,28,c.name.length);
    w16(ch,30,0); w16(ch,32,0); w16(ch,34,0); w16(ch,36,0); w32(ch,38,0);
    w32(ch,42,c.offset);
    chunks.push(new Uint8Array(ch.buffer),c.name);
    cdSize+=46+c.name.length;
  }
  const eo=new DataView(new ArrayBuffer(22));
  w32(eo,0,0x06054b50); w16(eo,4,0); w16(eo,6,0);
  w16(eo,8,central.length); w16(eo,10,central.length);
  w32(eo,12,cdSize); w32(eo,16,cdStart); w16(eo,20,0);
  chunks.push(new Uint8Array(eo.buffer));
  return new Blob(chunks,{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function xesc(s){return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function wp(text,bold,sz,color){
  const rpr='<w:rPr>'+(bold?'<w:b/>':'')+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'
    +(color?('<w:color w:val="'+color+'"/>'):'')+'</w:rPr>';
  return '<w:p><w:r>'+rpr+'<w:t xml:space="preserve">'+xesc(text)+'</w:t></w:r></w:p>';
}
function exportDocx(){
  const groups=exportEntries();
  if(!groups.length){alert('暂无可导出的条目');return;}
  let body=wp('微博观点库',true,32);
  body+=wp('范围：'+(curCat==='all'?'全部分类':(cats.find(c=>c.id===curCat)||{}).name)+'　生成：'+new Date().toLocaleString('zh-CN'),false,18,'888888');
  for(const g of groups){
    body+=wp('【'+g.c.name+'】',true,26,'FF8200');
    for(const e of g.items){
      body+=wp('◆ '+e.title,true,24);
      for(const ln of (e.text||'').split('\n')) body+=wp(ln===''?' ':ln,false,21);
      for(const sl of sourceLines(e)) body+=wp(sl,false,16,'888888');
      body+=wp('',false,21);
    }
  }
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'
    +body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:bottom="1440" w:left="1440" w:right="1440"/></w:sectPr>'
    +'</w:body></w:document>';
  const files=[
    {name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},
    {name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
    {name:'word/document.xml',data:doc}
  ];
  const blob=zipStore(files);
  dl(blob,'微博观点库_'+dateStr()+'.docx');
}
/* --- PDF：打印视图 --- */
function exportPdf(){
  const groups=exportEntries();
  if(!groups.length){alert('暂无可导出的条目');return;}
  let html='<h1>微博观点库</h1><div class="meta">范围：'+esc(curCat==='all'?'全部分类':(cats.find(c=>c.id===curCat)||{}).name)+'　生成：'+new Date().toLocaleString('zh-CN')+'</div>';
  for(const g of groups){
    html+='<h2>'+esc(g.c.name)+'</h2>';
    for(const e of g.items){
      html+='<div class="it"><div class="tt">'+esc(e.title)+'</div><div class="tx">'+esc(e.text)+'</div>';
      for(const sl of sourceLines(e)) html+='<div class="src">'+esc(sl)+'</div>';
      html+='</div>';
    }
  }
  const pa=document.getElementById('printArea');
  pa.innerHTML=html;
  window.print();
}
/* --- 备忘录纯文本 --- */
function buildTxt(){
  const groups=exportEntries();
  if(!groups.length) return '';
  let out='微博观点库\n';
  for(const g of groups){
    out+='\n—— '+g.c.name+' ——\n';
    for(const e of g.items){
      out+='\n【'+e.title+'】\n'+(e.text||'')+'\n';
      for(const sl of sourceLines(e)) out+=sl+'\n';
    }
  }
  return out;
}
function exportTxt(){
  const t=buildTxt();
  if(!t){alert('暂无可导出的条目');return;}
  dl(new Blob(["\ufeff"+t],{type:'text/plain;charset=utf-8'}),'微博观点库_'+dateStr()+'.txt');
}
async function copyTxt(){
  const t=buildTxt();
  if(!t){alert('暂无可导出的条目');return;}
  try{ await navigator.clipboard.writeText(t); alert('已复制，可直接粘贴到苹果备忘录'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制，可直接粘贴到苹果备忘录');
  }
}
function dateStr(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}
function dl(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}

/* ================= JSON 导入 / 导出 ================= */
function exportJson(){
  if(!entries.length){alert('暂无可导出的条目');return;}
  const meta = {
    generated_at: new Date().toLocaleString('zh-CN'),
    total_entries: entries.length
  };
  const data = {meta, cats, entries, inc:incSrc};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json;charset=utf-8'});
  dl(blob, '微博观点库_'+dateStr()+'.json');
}
document.getElementById('expJson').addEventListener('click', exportJson);
document.getElementById('impJson').addEventListener('click', ()=>{
  document.getElementById('jsonFile').click();
});
document.getElementById('jsonFile').addEventListener('change', async ev=>{
  const f = ev.target.files && ev.target.files[0];
  ev.target.value='';
  if(!f) return;
  setProg('读取 '+f.name+' …');
  try{
    const txt = await f.text();
    let d; try{ d = JSON.parse(txt); }catch(e){throw new Error('JSON 解析失败：'+e.message);}
    // 兼容两种格式：(A) 我们的 Python 导出格式 {meta, cats, entries, inc}
    //             (B) 前端 localStorage 精简格式 {cats, entries, inc}
    if(!d || !Array.isArray(d.cats) || !Array.isArray(d.entries))
      throw new Error('格式不符：缺少 cats 或 entries 数组');
    // 如果用户已有数据，提示是否合并
    let mode='overwrite';
    if(entries.length){
      const r = confirm('当前已有 '+entries.length+' 条数据。\n\n选择【确定】：覆盖（清空后载入新文件）\n选择【取消】：合并（按 sid 去重追加）');
      mode = r ? 'overwrite' : 'merge';
    }
    if(mode==='overwrite'){
      cats = d.cats.slice(); entries = d.entries.slice(); incSrc = !!d.inc;
      document.getElementById('incSrc').checked = incSrc;
    }else{
      // merge: 若 sid 已存在则 skip，否则 push；若 file 里的分类不存在则追加
      const sidSet = new Set(entries.map(e=>e.sid).filter(Boolean));
      const idMap  = new Map(cats.map(c=>[c.id,c]));
      for(const c of d.cats){ if(!idMap.has(c.id)) cats.push(c); idMap.set(c.id,c); }
      let added=0, skipped=0;
      for(const e of d.entries){
        if(e.sid && sidSet.has(e.sid)){skipped++;continue;}
        if(e.sid) sidSet.add(e.sid);
        entries.push(e); added++;
      }
      setProg('完成：新增 '+added+' 条，跳过重复 '+skipped+' 条');
      setTimeout(()=>setProg(''),5000);
    }
    curCat='all'; save(); render();
    if(mode==='overwrite'){
      setProg('载入完成：'+entries.length+' 条，分类数 '+cats.length);
      setTimeout(()=>setProg(''),4000);
    }
  }catch(e){
    setProg('导入失败');
    alert('导入失败：'+e.message);
  }
});

      return;
    }
    const r=mergeImport(list);
    document.getElementById('pasteArea').value='';
    setProg('完成：新增 '+r.added+' 条'+(r.skipped?('，跳过重复 '+r.skipped+' 条'):''));
    setTimeout(()=>setProg(''),5000);
  }catch(e){setProg('解析失败');}
});

/* 手机/局域网模式：若本地无数据且通过 http 访问，自动加载同目录 data_圆味糕蛋.json */
(function(){
  if(load()) return;
  if(!/^https?:$/.test(location.protocol)) return;
  fetch('data.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
    if(!d||!Array.isArray(d.cats))return;
    cats=d.cats; entries=d.entries||[];
    const es=d.meta&&d.meta.export_settings||{};
    incSrc=!!es.include_source;
    document.getElementById('incSrc').checked=incSrc;
    save(); render();
    setProg('✓ 已自动载入服务器数据：'+(d.meta&&d.meta.total_entries||entries.length)+' 条');
  }).catch(()=>{});
})();
